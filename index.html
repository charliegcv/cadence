<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Cadence">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadence</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", Helvetica, Arial, sans-serif;
      color: #1d1d1f;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 32px 24px;
      text-align: center;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #6e6e73;
    }

    .subtitle {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1.5px;
      margin-bottom: 55px;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: 64px;
      font-weight: 300;
      letter-spacing: -3px;
      margin-bottom: 45px;
    }

    .button {
      border: none;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .button:active { transform: scale(0.94); }
    .start { background: #1d1d1f; color: white; }
    .stop { background: #e5e5ea; color: #1d1d1f; }

    .stats {
      display: flex;
      gap: 12px;
      margin-top: 55px;
    }

    .stat {
      flex: 1;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      padding: 18px 10px;
    }

    .stat-label {
      font-size: 13px;
      color: #6e6e73;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 21px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .message {
      min-height: 22px;
      margin-top: 22px;
      font-size: 14px;
      color: #6e6e73;
    }

    .login {
      display: none;
    }

    .login input {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 14px 16px;
      border: 1px solid #d2d2d7;
      border-radius: 14px;
      font-size: 16px;
      background: white;
    }

    .login button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #1d1d1f;
      color: white;
      font-size: 16px;
      font-weight: 600;
      margin-top: 8px;
    }

    .error {
      color: #b00020;
      font-size: 14px;
      margin-top: 12px;
    }

    #app { display: none; }

    @media (max-width: 380px) {
      .timer { font-size: 52px; }
      .button { width: 135px; height: 135px; }
    }
  </style>
</head>

<body>

  <main class="container">

    <section id="login" class="login">
      <div class="title">📚 RÉVISION</div>
      <div class="subtitle">Connexion</div>

      <input id="email" type="email" placeholder="Adresse e-mail" autocomplete="email">
      <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password">
      <button id="loginButton">SE CONNECTER</button>
      <div id="loginMessage" class="error"></div>
    </section>

    <section id="app">

      <div class="title">📚 RÉVISION</div>
      <div class="subtitle">Temps de révision</div>

      <div id="timer" class="timer">00:00:00</div>

      <button id="mainButton" class="button start">
        ▶ DÉMARRER
      </button>

      <div id="message" class="message"></div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Aujourd'hui</div>
          <div id="today" class="stat-value">0 min</div>
        </div>

        <div class="stat">
          <div class="stat-label">Cette année</div>
          <div id="year" class="stat-value">0 h 0 min</div>
        </div>
      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ============================================================
    // SUPABASE
    // Remplace uniquement les 2 valeurs ci-dessous.
    // ============================================================

    const SUPABASE_URL = "https://fphtgzccyhztlntcgjom.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_mYuUnTM4iiSKdc2hc5n_cA_e8WzMUm9";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // ============================================================
    // ELEMENTS
    // ============================================================

    const loginSection = document.getElementById("login");
    const appSection = document.getElementById("app");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");

    const timer = document.getElementById("timer");
    const button = document.getElementById("mainButton");
    const message = document.getElementById("message");
    const todayDisplay = document.getElementById("today");
    const yearDisplay = document.getElementById("year");

    let currentUser = null;
    let timerState = null;
    let displayInterval = null;
    let syncInterval = null;

    // ============================================================
    // FORMAT
    // ============================================================

    function formatTime(seconds) {
      seconds = Math.max(0, Math.floor(seconds));

      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      return String(hours).padStart(2, "0") + ":" +
             String(minutes).padStart(2, "0") + ":" +
             String(secs).padStart(2, "0");
    }

    function formatStats(seconds) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      return hours + " h " + minutes + " min";
    }

    // ============================================================
    // AUTHENTIFICATION
    // ============================================================

    async function init() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        loginMessage.textContent = error.message;
        showLogin();
        return;
      }

      if (data.session) {
        currentUser = data.session.user;
        await startApp();
      } else {
        showLogin();
      }

      db.auth.onAuthStateChange(async (_event, session) => {
        if (session) {
          currentUser = session.user;
          await startApp();
        } else {
          currentUser = null;
          showLogin();
        }
      });
    }

    function showLogin() {
      loginSection.style.display = "block";
      appSection.style.display = "none";
    }

    async function login() {
      loginMessage.textContent = "";

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        loginMessage.textContent = "Entre ton e-mail et ton mot de passe.";
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "CONNEXION…";

      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        loginMessage.textContent = error.message;
      }

      loginButton.disabled = false;
      loginButton.textContent = "SE CONNECTER";
    }

    loginButton.addEventListener("click", login);

    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });

    // ============================================================
    // TIMER CLOUD
    // ============================================================

    async function loadTimerState() {
      const { data, error } = await db
        .from("timer_state")
        .select("*")
        .eq("user_id", currentUser.id)
        .maybeSingle();

      if (error) {
        message.textContent = "Erreur de synchronisation.";
        console.error(error);
        return;
      }

      if (!data) {
        const { data: created, error: createError } = await db
          .from("timer_state")
          .insert({
            user_id: currentUser.id,
            is_running: false,
            started_at: null
          })
          .select()
          .single();

        if (createError) {
          message.textContent = "Erreur de création du chronomètre.";
          console.error(createError);
          return;
        }

        timerState = created;
      } else {
        timerState = data;
      }

      renderTimerState();
    }

    async function startTimer() {
      const now = new Date().toISOString();

      const { data, error } = await db
        .from("timer_state")
        .update({
          is_running: true,
          started_at: now
        })
        .eq("user_id", currentUser.id)
        .select()
        .single();

      if (error) {
        message.textContent = "Impossible de démarrer.";
        console.error(error);
        return;
      }

      timerState = data;
      renderTimerState();
    }

    async function stopTimer() {
      if (!timerState || !timerState.is_running || !timerState.started_at) {
        return;
      }

      const endedAt = new Date();
      const startedAt = new Date(timerState.started_at);
      const duration = Math.max(
        0,
        Math.floor((endedAt.getTime() - startedAt.getTime()) / 1000)
      );

      // Enregistre la session.
      if (duration > 0) {
        const { error: sessionError } = await db
          .from("sessions")
          .insert({
            user_id: currentUser.id,
            started_at: timerState.started_at,
            ended_at: endedAt.toISOString(),
            duration_seconds: duration
          });

        if (sessionError) {
          message.textContent = "Erreur d'enregistrement.";
          console.error(sessionError);
          return;
        }
      }

      // Arrête le chronomètre dans le cloud.
      const { data, error } = await db
        .from("timer_state")
        .update({
          is_running: false,
          started_at: null
        })
        .eq("user_id", currentUser.id)
        .select()
        .single();

      if (error) {
        message.textContent = "Impossible d'arrêter.";
        console.error(error);
        return;
      }

      timerState = data;
      message.textContent = "Session enregistrée ✓";

      renderTimerState();
      await updateStats();
    }

    // ============================================================
    // AFFICHAGE
    // ============================================================

    function renderTimerState() {
      if (!timerState) return;

      if (timerState.is_running && timerState.started_at) {
        button.textContent = "⏹ ARRÊTER";
        button.classList.remove("start");
        button.classList.add("stop");

        if (!message.textContent.includes("enregistrée")) {
          message.textContent = "Session en cours";
        }

        updateTimerDisplay();
      } else {
        timer.textContent = "00:00:00";
        button.textContent = "▶ DÉMARRER";
        button.classList.remove("stop");
        button.classList.add("start");

        if (!message.textContent.includes("enregistrée")) {
          message.textContent = "";
        }
      }
    }

    function updateTimerDisplay() {
      if (!timerState || !timerState.is_running || !timerState.started_at) {
        timer.textContent = "00:00:00";
        return;
      }

      const started = new Date(timerState.started_at).getTime();
      const elapsed = Math.floor((Date.now() - started) / 1000);

      timer.textContent = formatTime(elapsed);
    }

    // ============================================================
    // STATISTIQUES
    // ============================================================

    async function updateStats() {
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 1).toISOString();
      const startOfTomorrow = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate() + 1
      ).toISOString();

      const startOfToday = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      ).toISOString();

      const { data, error } = await db
        .from("sessions")
        .select("started_at, duration_seconds")
        .eq("user_id", currentUser.id)
        .gte("started_at", startOfYear);

      if (error) {
        console.error(error);
        return;
      }

      let yearSeconds = 0;
      let todaySeconds = 0;

      (data || []).forEach(session => {
        const duration = Number(session.duration_seconds) || 0;
        yearSeconds += duration;

        if (
          session.started_at >= startOfToday &&
          session.started_at < startOfTomorrow
        ) {
          todaySeconds += duration;
        }
      });

      todayDisplay.textContent = Math.floor(todaySeconds / 60) + " min";
      yearDisplay.textContent = formatStats(yearSeconds);
    }

    // ============================================================
    // SYNCHRONISATION ENTRE APPAREILS
    // ============================================================

    async function syncFromCloud() {
      if (!currentUser) return;

      const { data, error } = await db
        .from("timer_state")
        .select("*")
        .eq("user_id", currentUser.id)
        .maybeSingle();

      if (!error && data) {
        const wasRunning = timerState && timerState.is_running;
        timerState = data;

        if (wasRunning && !data.is_running) {
          message.textContent = "Session enregistrée ✓";
          await updateStats();
        }

        renderTimerState();
      }
    }

    async function startApp() {
      loginSection.style.display = "none";
      appSection.style.display = "block";

      await loadTimerState();
      await updateStats();

      clearInterval(displayInterval);
      clearInterval(syncInterval);

      displayInterval = setInterval(updateTimerDisplay, 250);

      // Vérifie le cloud chaque seconde pour synchroniser
      // iPhone, iPad et ordinateur.
      syncInterval = setInterval(syncFromCloud, 1000);
    }

    // ============================================================
    // BOUTON
    // ============================================================

    button.addEventListener("click", async () => {
      if (!timerState || !timerState.is_running) {
        await startTimer();
      } else {
        await stopTimer();
      }
    });

    // ============================================================
    // DÉMARRAGE
    // ============================================================

    init();
  </script>

</body>
</html>
