<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temps de révision</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", Helvetica, Arial, sans-serif;
      color: #1d1d1f;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 32px 24px;
      text-align: center;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #6e6e73;
    }

    .subtitle {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1.5px;
      margin-bottom: 55px;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: 64px;
      font-weight: 300;
      letter-spacing: -3px;
      margin-bottom: 45px;
    }

    .button {
      border: none;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .button:active {
      transform: scale(0.94);
    }

    .start {
      background: #1d1d1f;
      color: white;
    }

    .stop {
      background: #e5e5ea;
      color: #1d1d1f;
    }

    .stats {
      display: flex;
      gap: 12px;
      margin-top: 55px;
    }

    .stat {
      flex: 1;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      padding: 18px 10px;
    }

    .stat-label {
      font-size: 13px;
      color: #6e6e73;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 21px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .message {
      height: 22px;
      margin-top: 22px;
      font-size: 14px;
      color: #6e6e73;
    }

    @media (max-width: 380px) {
      .timer {
        font-size: 52px;
      }

      .button {
        width: 135px;
        height: 135px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="title">📚 RÉVISION</div>

    <div class="subtitle">Temps de révision</div>

    <div id="timer" class="timer">00:00:00</div>

    <button id="mainButton" class="button start">
      ▶ DÉMARRER
    </button>

    <div id="message" class="message"></div>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">Aujourd'hui</div>
        <div id="today" class="stat-value">0 min</div>
      </div>

      <div class="stat">
        <div class="stat-label">Cette année</div>
        <div id="year" class="stat-value">0 h</div>
      </div>

    </div>

  </main>

  <script>

    // =========================
    // VARIABLES
    // =========================

    let startTime = null;
    let interval = null;

    const timer = document.getElementById("timer");
    const button = document.getElementById("mainButton");
    const message = document.getElementById("message");
    const todayDisplay = document.getElementById("today");
    const yearDisplay = document.getElementById("year");


    // =========================
    // STOCKAGE
    // =========================

    function getSessions() {
      return JSON.parse(localStorage.getItem("revisionSessions") || "[]");
    }

    function saveSession(duration) {

      const sessions = getSessions();

      sessions.push({
        date: new Date().toISOString(),
        duration: duration
      });

      localStorage.setItem(
        "revisionSessions",
        JSON.stringify(sessions)
      );
    }


    // =========================
    // FORMAT DU TEMPS
    // =========================

    function formatTime(seconds) {

      const hours = Math.floor(seconds / 3600);

      const minutes = Math.floor(
        (seconds % 3600) / 60
      );

      const secs = seconds % 60;

      return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0")
      );
    }


    // =========================
    // AFFICHAGE DES STATISTIQUES
    // =========================

    function updateStats() {

      const sessions = getSessions();

      const now = new Date();

      let todaySeconds = 0;
      let yearSeconds = 0;

      sessions.forEach(session => {

        const date = new Date(session.date);

        if (
          date.getFullYear() === now.getFullYear() &&
          date.getMonth() === now.getMonth() &&
          date.getDate() === now.getDate()
        ) {
          todaySeconds += session.duration;
        }

        if (
          date.getFullYear() === now.getFullYear()
        ) {
          yearSeconds += session.duration;
        }

      });


      const todayMinutes = Math.floor(todaySeconds / 60);

      const yearHours = Math.floor(yearSeconds / 3600);

      const yearMinutes = Math.floor(
        (yearSeconds % 3600) / 60
      );


      todayDisplay.textContent =
        todayMinutes + " min";

      yearDisplay.textContent =
        yearHours + " h " + yearMinutes + " min";
    }


    // =========================
    // DÉMARRER
    // =========================

    function startTimer() {

      startTime = Date.now();

      button.textContent = "⏹ ARRÊTER";

      button.classList.remove("start");
      button.classList.add("stop");

      message.textContent = "Session en cours";

      interval = setInterval(updateTimer, 250);

      updateTimer();
    }


    // =========================
    // CHRONOMÈTRE
    // =========================

    function updateTimer() {

      if (!startTime) return;

      const elapsed =
        Math.floor((Date.now() - startTime) / 1000);

      timer.textContent =
        formatTime(elapsed);
    }


    // =========================
    // ARRÊTER
    // =========================

    function stopTimer() {

      if (!startTime) return;

      const duration =
        Math.floor((Date.now() - startTime) / 1000);

      clearInterval(interval);

      saveSession(duration);

      startTime = null;
      interval = null;

      timer.textContent = "00:00:00";

      button.textContent = "▶ DÉMARRER";

      button.classList.remove("stop");
      button.classList.add("start");

      message.textContent =
        "Session enregistrée ✓";

      updateStats();
    }


    // =========================
    // BOUTON
    // =========================

    button.addEventListener("click", () => {

      if (startTime === null) {
        startTimer();
      } else {
        stopTimer();
      }

    });


    // =========================
    // INITIALISATION
    // =========================

    updateStats();

  </script>

</body>
</html>
